services:
  - type: web
    name: sidejob-diagnosis-test
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_URL
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_REDIRECT_URI
        sync: false
      - key: LINE_MESSAGING_ACCESS_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  # 診断画面（スリープしない無料Static Site）
  - type: web
    name: sidejob-diagnosis-front
    runtime: static
    buildCommand: node scripts/build-static.js
    staticPublishPath: ./dist
    envVars:
      - key: API_BASE
        value: https://sidejob-diagnosis-5.onrender.com
